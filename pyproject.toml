[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "story-architect"
version = "0.1.0"
description = "Story-writing environment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "rapidfuzz>=3.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "regex>=2026.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
story-architect = "story_architect.app.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
story_architect = ["web/**/*", "data/**/*"]
