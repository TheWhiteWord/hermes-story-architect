[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-story-architect"
version = "0.1.0"
description = "Story-writing environment for Hermes Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rapidfuzz>=3.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "regex>=2026.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plugin*"]
namespaces = true
