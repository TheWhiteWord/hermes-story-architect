<!DOCTYPE html>
<html>
<body style="margin:0;padding:32px;background:#1a1a2e;display:inline-block;">

<style>
  :root {
    --bg:          #12121f;
    --border:      #2e2e4a;
    --muted-fg:    #6b6b99;
    --fg:          #e0e0f0;
    --beat-crisis: #f0e040;
    --beat-climax: #c0c8ff;
    --char-kael:   #7eb8f7;
    --char-mira:   #a07ef7;
    --char-admin:  #ef6c6c;
    --avenue:      rgba(255,255,255,0.07);
    --avenue-edge: rgba(255,255,255,0.18);
  }
</style>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="780"
  height="420"
  viewBox="0 0 780 420"
  style="display:block;font-family:'Inter','Segoe UI',system-ui,sans-serif;"
>
  <!--
    MOCKUP: Structural avenue WITH ANTAGONIST.

    ANTAGONIST (The Administrator, w=0.7):
      beat-1: central-room-day    y=-0.1  (calm, in control)
      beat-2: central-room-night  y=+0.3  (offering comfort)
      beat-3: the-core-day        y=-0.5  (losing control)
      beat-4: the-door-closes     y=-0.2  (acceptance)

    WEIGHTED AVERAGE (Kael=1.0, Mira=0.4, Admin=0.7):
      Scene 1: (0.2*1.0 + -0.1*0.7) / 1.7 = 0.076  → y=187
      Scene 2: (-0.3*1.0 + 0.2*0.4 + 0.3*0.7) / 2.1 = -0.005 → y=201
      Scene 3: (0.6*1.0 + 0.6*0.4 + -0.5*0.7) / 2.1 = 0.233 → y=160
      Scene 4: (0.4*1.0 + -0.2*0.7) / 1.7 = 0.153  → y=174

    Without antagonist: 160,166 → 315,227 → 487,98 → 655,132
    With antagonist:    160,187 → 315,201 → 487,160 → 655,174

    The antagonist PULLS THE ARC UP — makes it less extreme, more neutral.
    The band is also NARROWER because more characters = more averaging.

    Range = ±0.12 (tighter with more characters contributing).
  -->

  <defs>
    <filter id="avenue-blur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- LAYER 1: ACT BANDS -->
  <rect x="60"  y="30" width="340" height="340" fill="rgba(255,255,255,0.025)"/>
  <rect x="400" y="30" width="340" height="340" fill="rgba(255,255,255,0.010)"/>

  <!-- LAYER 2: INTENDED TRAJECTORY -->
  <line x1="160" y1="115" x2="655" y2="200"
        stroke="rgba(255,255,255,0.15)"
        stroke-width="1.5"
        stroke-dasharray="6,4"/>

  <!-- LAYER 3: STRUCTURAL AVENUE (with antagonist) -->
  <!-- Range ±0.12 around derived arc -->
  <!-- Upper: 0.196, 0.115, 0.353, 0.273 → y=167, 180, 140, 154 -->
  <!-- Lower: -0.044, -0.125, 0.113, 0.033 → y=207, 221, 181, 194 -->
  <polygon
    points="160,167 315,180 487,140 655,154 655,194 487,181 315,221 160,207"
    fill="var(--avenue)"
    filter="url(#avenue-blur)"
  />
  <polyline
    points="160,167 315,180 487,140 655,154"
    fill="none"
    stroke="var(--avenue-edge)"
    stroke-width="1"
    opacity="0.5"
  />
  <polyline
    points="160,207 315,221 487,181 655,194"
    fill="none"
    stroke="var(--avenue-edge)"
    stroke-width="1"
    opacity="0.5"
  />

  <!-- LAYER 4: ACT BOUNDARY LINES + ZERO AXIS -->
  <line x1="60"  y1="30"  x2="60"  y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="400" y1="30"  x2="400" y2="370" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="740" y1="30"  x2="740" y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="60"  y1="200" x2="740" y2="200"
        stroke="var(--border)" stroke-width="1" stroke-dasharray="2,5" opacity="0.6"/>

  <!-- LAYER 5: Y-AXIS TICKS + LABELS -->
  <g fill="var(--muted-fg)" font-size="9" text-anchor="end">
    <line x1="56" y1="30"  x2="60" y2="30"  stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="34">+1.0</text>
    <line x1="56" y1="115" x2="60" y2="115" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="119">+0.5</text>
    <line x1="56" y1="200" x2="60" y2="200" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="204">0</text>
    <line x1="56" y1="285" x2="60" y2="285" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="289">−0.5</text>
    <line x1="56" y1="370" x2="60" y2="370" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="374">−1.0</text>
  </g>

  <!-- LAYER 6: ACT LABELS -->
  <text x="68"  y="58" fill="var(--muted-fg)" font-size="10" opacity="0.7"  font-weight="500">Act One</text>
  <text x="408" y="58" fill="var(--muted-fg)" font-size="10" opacity="0.35" font-weight="500">Act Two</text>

  <!-- LAYER 7: CHARACTER POLYLINES -->
  <!-- Kael (Protagonist) -->
  <polyline
    points="160,166 315,251 487,98 655,132"
    fill="none"
    stroke="var(--char-kael)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Mira (Supporting) -->
  <polyline
    points="315,183 487,166"
    fill="none"
    stroke="var(--char-mira)"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.75"
  />
  <!-- The Administrator (Antagonist) -->
  <polyline
    points="160,217 315,149 487,285 655,234"
    fill="none"
    stroke="var(--char-admin)"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- LAYER 8: BEAT DOTS -->
  <!-- Kael -->
  <circle cx="160" cy="166" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <circle cx="315" cy="251" r="6" fill="var(--beat-crisis)" opacity="0.95"/>
  <text x="320" y="248" fill="var(--beat-crisis)" font-size="8" opacity="0.85">crisis</text>
  <circle cx="487" cy="98" r="7"   fill="none" stroke="var(--beat-climax)" stroke-width="2" opacity="0.9"/>
  <circle cx="487" cy="98" r="3"   fill="var(--char-kael)" opacity="0.7"/>
  <text x="492" y="95" fill="var(--beat-climax)" font-size="8" opacity="0.85">climax</text>
  <circle cx="655" cy="132" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <!-- Mira -->
  <circle cx="315" cy="183" r="5" fill="var(--char-mira)" opacity="0.85"/>
  <circle cx="487" cy="166" r="5" fill="var(--char-mira)" opacity="0.85"/>
  <!-- Administrator -->
  <circle cx="160" cy="217" r="5" fill="var(--char-admin)" opacity="0.85"/>
  <circle cx="315" cy="149" r="5" fill="var(--char-admin)" opacity="0.85"/>
  <circle cx="487" cy="285" r="5" fill="var(--char-admin)" opacity="0.85"/>
  <circle cx="655" cy="234" r="5" fill="var(--char-admin)" opacity="0.85"/>

  <!-- LAYER 9: LEGEND -->
  <g transform="translate(460, 310)">
    <line x1="0" y1="5" x2="20" y2="5" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="24" y="9" fill="var(--fg)" font-size="9" opacity="0.85">Intended trajectory</text>

    <rect x="0" y="22" width="14" height="14" rx="2" fill="var(--avenue)" stroke="var(--avenue-edge)" stroke-width="1"/>
    <text x="18" y="32" fill="var(--fg)" font-size="9" opacity="0.85">Structural avenue (±0.12)</text>

    <line x1="0" y1="48" x2="20" y2="48" stroke="var(--char-kael)" stroke-width="2.5"/>
    <circle cx="10" cy="48" r="4" fill="var(--char-kael)"/>
    <text x="24" y="52" fill="var(--fg)" font-size="9" opacity="0.85">Kael (Protagonist, w=1.0)</text>

    <line x1="0" y1="64" x2="20" y2="64" stroke="var(--char-mira)" stroke-width="2" opacity="0.75"/>
    <circle cx="10" cy="64" r="4" fill="var(--char-mira)" opacity="0.85"/>
    <text x="24" y="68" fill="var(--fg)" font-size="9" opacity="0.85">Mira (Supporting, w=0.4)</text>

    <line x1="0" y1="80" x2="20" y2="80" stroke="var(--char-admin)" stroke-width="2" opacity="0.8"/>
    <circle cx="10" cy="80" r="4" fill="var(--char-admin)" opacity="0.85"/>
    <text x="24" y="84" fill="var(--fg)" font-size="9" opacity="0.85">Administrator (Antagonist, w=0.7)</text>
  </g>

  <!-- GRAPH BORDER -->
  <rect x="60" y="30" width="680" height="340"
        fill="none"
        stroke="var(--border)"
        stroke-width="1"
        opacity="0.5"/>
</svg>

</body>
</html>
