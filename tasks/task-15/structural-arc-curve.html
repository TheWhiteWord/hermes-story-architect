<!DOCTYPE html>
<html>
<body style="margin:0;padding:32px;background:#1a1a2e;display:inline-block;">

<style>
  :root {
    --bg:          #12121f;
    --border:      #2e2e4a;
    --muted-fg:    #6b6b99;
    --fg:          #e0e0f0;
    --beat-crisis: #f0e040;
    --beat-climax: #c0c8ff;
    --char-kael:   #7eb8f7;
    --char-mira:   #a07ef7;
    --struct-arc:  rgba(255,255,255,0.35);
  }
</style>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="780"
  height="420"
  viewBox="0 0 780 420"
  style="display:block;font-family:'Inter','Segoe UI',system-ui,sans-serif;"
>
  <!--
    MOCKUP: Structural arc as curved polyline (like character arcs).
    Same visual grammar — just thicker + muted white to differentiate.

    Hypothetical structural values per scene (NOT in current data — this is a mockup):
      central-room-day:    y_struct = +0.3  → ysvg = 149
      central-room-night:  y_struct = +0.1  → ysvg = 183
      the-core-day:        y_struct = -0.2  → ysvg = 234
      the-door-closes:     y_struct = -0.4  → ysvg = 268

    This creates a downward trending curve — starts positive, ends negative,
    with a dip at the crisis. Same shape language as character arcs.

    Polyline: 160,149 → 315,183 → 487,234 → 655,268
  -->

  <!-- LAYER 1: ACT BANDS -->
  <rect x="60"  y="30" width="340" height="340" fill="rgba(255,255,255,0.025)"/>
  <rect x="400" y="30" width="340" height="340" fill="rgba(255,255,255,0.010)"/>

  <!-- LAYER 2: STRUCTURAL ARC (curved polyline, thicker) -->
  <polyline
    points="160,149 315,183 487,234 655,268"
    fill="none"
    stroke="var(--struct-arc)"
    stroke-width="4"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- LAYER 3: ACT BOUNDARY LINES + ZERO AXIS -->
  <line x1="60"  y1="30"  x2="60"  y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="400" y1="30"  x2="400" y2="370" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="740" y1="30"  x2="740" y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="60"  y1="200" x2="740" y2="200"
        stroke="var(--border)" stroke-width="1" stroke-dasharray="2,5" opacity="0.6"/>

  <!-- LAYER 4: Y-AXIS TICKS + LABELS -->
  <g fill="var(--muted-fg)" font-size="9" text-anchor="end">
    <line x1="56" y1="30"  x2="60" y2="30"  stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="34">+1.0</text>
    <line x1="56" y1="115" x2="60" y2="115" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="119">+0.5</text>
    <line x1="56" y1="200" x2="60" y2="200" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="204">0</text>
    <line x1="56" y1="285" x2="60" y2="285" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="289">−0.5</text>
    <line x1="56" y1="370" x2="60" y2="370" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="374">−1.0</text>
  </g>

  <!-- LAYER 5: ACT LABELS -->
  <text x="68"  y="58" fill="var(--muted-fg)" font-size="10" opacity="0.7"  font-weight="500">Act One</text>
  <text x="408" y="58" fill="var(--muted-fg)" font-size="10" opacity="0.35" font-weight="500">Act Two</text>

  <!-- LAYER 6: CHARACTER POLYLINES -->
  <polyline
    points="160,166 315,251 487,98 655,132"
    fill="none"
    stroke="var(--char-kael)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <polyline
    points="230,115 570,234"
    fill="none"
    stroke="var(--char-mira)"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- LAYER 7: BEAT DOTS -->
  <circle cx="160" cy="166" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <circle cx="315" cy="251" r="6" fill="var(--beat-crisis)" opacity="0.95"/>
  <text x="320" y="248" fill="var(--beat-crisis)" font-size="8" opacity="0.85">crisis</text>
  <circle cx="487" cy="98" r="7"   fill="none" stroke="var(--beat-climax)" stroke-width="2" opacity="0.9"/>
  <circle cx="487" cy="98" r="3"   fill="var(--char-kael)" opacity="0.7"/>
  <text x="492" y="95" fill="var(--beat-climax)" font-size="8" opacity="0.85">climax</text>
  <circle cx="655" cy="132" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <circle cx="230" cy="115" r="5" fill="var(--char-mira)" opacity="0.85"/>
  <circle cx="570" cy="234" r="5" fill="var(--char-mira)" opacity="0.85"/>

  <!-- LAYER 8: LEGEND -->
  <g transform="translate(480, 320)">
    <line x1="0" y1="5" x2="20" y2="5" stroke="var(--struct-arc)" stroke-width="4" opacity="0.6"/>
    <text x="24" y="9" fill="var(--fg)" font-size="9" opacity="0.85">Structural arc (mockup)</text>

    <line x1="0" y1="28" x2="20" y2="28" stroke="var(--char-kael)" stroke-width="2.5"/>
    <circle cx="10" cy="28" r="4" fill="var(--char-kael)"/>
    <text x="24" y="32" fill="var(--fg)" font-size="9" opacity="0.85">Kael (Protagonist)</text>

    <line x1="0" y1="46" x2="20" y2="46" stroke="var(--char-mira)" stroke-width="2" opacity="0.75"/>
    <circle cx="10" cy="46" r="4" fill="var(--char-mira)" opacity="0.85"/>
    <text x="24" y="50" fill="var(--fg)" font-size="9" opacity="0.85">Mira (Supporting)</text>
  </g>

  <!-- GRAPH BORDER -->
  <rect x="60" y="30" width="680" height="340"
        fill="none"
        stroke="var(--border)"
        stroke-width="1"
        opacity="0.5"/>
</svg>

</body>
</html>
