<!DOCTYPE html>
<html>
<body style="margin:0;padding:32px;background:#1a1a2e;display:inline-block;">

<style>
  :root {
    --bg:          #12121f;
    --border:      #2e2e4a;
    --muted-fg:    #6b6b99;
    --fg:          #e0e0f0;
    --beat-crisis: #f0e040;
    --beat-climax: #c0c8ff;
    --char-kael:   #7eb8f7;
    --char-mira:   #a07ef7;
    --avenue:      rgba(255,255,255,0.07);
    --avenue-edge: rgba(255,255,255,0.18);
    --avenue-core: rgba(255,255,255,0.35);
  }
</style>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="780"
  height="420"
  viewBox="0 0 780 420"
  style="display:block;font-family:'Inter','Segoe UI',system-ui,sans-serif;"
>
  <!--
    MOCKUP: Structural avenue (soft band, not thin line).

    The avenue = acceptable range around the derived structural arc.
    Characters traveling WITHIN the band = healthy.
    Characters drifting OUTSIDE = potential coherence issue.

    Derived arc computation (weighted avg, protagonist=1.0, supporting=0.4):
      Scene 1: (0.2*1.0) / 1.0 = 0.20
      Scene 2: (-0.3*1.0 + 0.2*0.4) / 1.4 = -0.16
      Scene 3: (0.6*1.0 + 0.6*0.4) / 1.4 = 0.60
      Scene 4: (0.4*1.0) / 1.0 = 0.40

    Avenue range = ±0.15 around center (acceptable drift margin).

    Upper bounds: +0.35, -0.01, +0.75, +0.55
    Lower bounds: +0.05, -0.31, +0.45, +0.25

    Band polygon:
      Upper: 160,141 → 315,202 → 487,73 → 655,107
      Lower: 160,192 → 315,253 → 487,124 → 655,158

    Intended: positive(+0.5) → ironic(0.0) = dashed line from (160,115) to (655,200)
  -->

  <defs>
    <filter id="avenue-blur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- LAYER 1: ACT BANDS -->
  <rect x="60"  y="30" width="340" height="340" fill="rgba(255,255,255,0.025)"/>
  <rect x="400" y="30" width="340" height="340" fill="rgba(255,255,255,0.010)"/>

  <!-- LAYER 2: INTENDED TRAJECTORY (faint dashed line) -->
  <line x1="160" y1="115" x2="655" y2="200"
        stroke="rgba(255,255,255,0.15)"
        stroke-width="1.5"
        stroke-dasharray="6,4"/>

  <!-- LAYER 3: STRUCTURAL AVENUE (soft band = acceptable range) -->
  <!--
    Range = derived structural arc ± 0.15 (acceptable drift margin).
    The band height IS the range — not a visual effect.
    Characters inside = within acceptable range.
    Characters outside = coherence warning fires.
  -->
  <polygon
    points="160,141 315,202 487,73 655,107 655,158 487,124 315,253 160,192"
    fill="var(--avenue)"
    filter="url(#avenue-blur)"
  />
  <!-- Avenue edges for subtle definition -->
  <polyline
    points="160,141 315,202 487,73 655,107"
    fill="none"
    stroke="var(--avenue-edge)"
    stroke-width="1"
    opacity="0.5"
  />
  <polyline
    points="160,192 315,253 487,124 655,158"
    fill="none"
    stroke="var(--avenue-edge)"
    stroke-width="1"
    opacity="0.5"
  />

  <!-- LAYER 4: ACT BOUNDARY LINES + ZERO AXIS -->
  <line x1="60"  y1="30"  x2="60"  y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="400" y1="30"  x2="400" y2="370" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="740" y1="30"  x2="740" y2="370" stroke="var(--border)" stroke-width="1"/>
  <line x1="60"  y1="200" x2="740" y2="200"
        stroke="var(--border)" stroke-width="1" stroke-dasharray="2,5" opacity="0.6"/>

  <!-- LAYER 5: Y-AXIS TICKS + LABELS -->
  <g fill="var(--muted-fg)" font-size="9" text-anchor="end">
    <line x1="56" y1="30"  x2="60" y2="30"  stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="34">+1.0</text>
    <line x1="56" y1="115" x2="60" y2="115" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="119">+0.5</text>
    <line x1="56" y1="200" x2="60" y2="200" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="204">0</text>
    <line x1="56" y1="285" x2="60" y2="285" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="289">−0.5</text>
    <line x1="56" y1="370" x2="60" y2="370" stroke="var(--muted-fg)" stroke-width="1"/>
    <text x="52" y="374">−1.0</text>
  </g>

  <!-- LAYER 6: ACT LABELS -->
  <text x="68"  y="58" fill="var(--muted-fg)" font-size="10" opacity="0.7"  font-weight="500">Act One</text>
  <text x="408" y="58" fill="var(--muted-fg)" font-size="10" opacity="0.35" font-weight="500">Act Two</text>

  <!-- LAYER 7: CHARACTER POLYLINES -->
  <polyline
    points="160,166 315,251 487,98 655,132"
    fill="none"
    stroke="var(--char-kael)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <polyline
    points="315,183 487,166"
    fill="none"
    stroke="var(--char-mira)"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- LAYER 8: BEAT DOTS -->
  <circle cx="160" cy="166" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <circle cx="315" cy="251" r="6" fill="var(--beat-crisis)" opacity="0.95"/>
  <text x="320" y="248" fill="var(--beat-crisis)" font-size="8" opacity="0.85">crisis</text>
  <circle cx="487" cy="98" r="7"   fill="none" stroke="var(--beat-climax)" stroke-width="2" opacity="0.9"/>
  <circle cx="487" cy="98" r="3"   fill="var(--char-kael)" opacity="0.7"/>
  <text x="492" y="95" fill="var(--beat-climax)" font-size="8" opacity="0.85">climax</text>
  <circle cx="655" cy="132" r="5" fill="var(--char-kael)" opacity="0.9"/>
  <circle cx="315" cy="183" r="5" fill="var(--char-mira)" opacity="0.85"/>
  <circle cx="487" cy="166" r="5" fill="var(--char-mira)" opacity="0.85"/>

  <!-- LAYER 9: LEGEND -->
  <g transform="translate(460, 320)">
    <!-- Intended -->
    <line x1="0" y1="5" x2="20" y2="5" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="24" y="9" fill="var(--fg)" font-size="9" opacity="0.85">Intended trajectory</text>

    <!-- Avenue (no center line — the band IS the range) -->
    <rect x="0" y="22" width="14" height="14" rx="2" fill="var(--avenue)" stroke="var(--avenue-edge)" stroke-width="1"/>
    <text x="18" y="32" fill="var(--fg)" font-size="9" opacity="0.85">Structural avenue (acceptable range)</text>

    <!-- Kael -->
    <line x1="0" y1="48" x2="20" y2="48" stroke="var(--char-kael)" stroke-width="2.5"/>
    <circle cx="10" cy="48" r="4" fill="var(--char-kael)"/>
    <text x="24" y="52" fill="var(--fg)" font-size="9" opacity="0.85">Kael (Protagonist, w=1.0)</text>

    <!-- Mira -->
    <line x1="0" y1="66" x2="20" y2="66" stroke="var(--char-mira)" stroke-width="2" opacity="0.75"/>
    <circle cx="10" cy="66" r="4" fill="var(--char-mira)" opacity="0.85"/>
    <text x="24" y="70" fill="var(--fg)" font-size="9" opacity="0.85">Mira (Supporting, w=0.4)</text>
  </g>

  <!-- GRAPH BORDER -->
  <rect x="60" y="30" width="680" height="340"
        fill="none"
        stroke="var(--border)"
        stroke-width="1"
        opacity="0.5"/>
</svg>

</body>
</html>
