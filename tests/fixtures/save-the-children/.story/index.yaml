arcs:
- id: '1'
  character: dr-elena-voss
  scene: central-room-day
  label: The Choice
  action: Elena makes the call — save the minds, abandon the bodies. Four hundred
    people will die so four hundred others can live forever.
  gap: She expects relief. She gets silence.
  choice: She does not explain herself to Marcus. She signs the order.
  shift: positive → negative
  y: 0.8
  order: 1
  is_crisis: false
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '2'
  character: dr-elena-voss
  scene: central-room-night
  label: The Haunting
  action: Elena watches the preserved children through the system. She cannot intervene,
    cannot speak, cannot look away. Kael grows up in a world she built.
  gap: She expected to feel pride. She feels like a ghost watching a life she made
    possible but cannot touch.
  choice: She does not reveal herself to Kael. She watches.
  shift: negative → negative
  y: 0.2
  order: 2
  is_crisis: true
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '3'
  character: dr-elena-voss
  scene: the-core-day
  label: The Truth
  action: Elena makes contact with Kael. She tells him what she did. She does not
    ask for forgiveness.
  gap: She expected judgment. She gets understanding — and that is worse.
  choice: She tells the truth. She lets Kael decide what to do with it.
  shift: negative → mixed
  y: -0.3
  order: 3
  is_crisis: false
  is_climax: true
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '1'
  character: kael
  scene: central-room-day
  label: The Door Was Never Locked
  action: Kael tests the door handle. It turns. The lock was never engaged — the imprisonment
    was always internal.
  gap: Kael expected resistance, a clear enemy. Instead, the door was always open
    — the only thing keeping them inside was the belief that it was locked.
  choice: Kael walks through. Not because they understand, but because they can't
    unsee it now.
  shift: positive → mixed
  y: 0.6
  order: 1
  is_crisis: false
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '2'
  character: kael
  scene: central-room-night
  label: The Offer
  action: The Administrator makes its case — stay, and the world remains comprehensible.
    Leave, and lose every certainty Kael has ever had.
  gap: 'Kael expected the Administrator to threaten, to coerce. Instead, it asks a
    question: ''What will you be, out there, without the walls that made you?'''
  choice: Kael refuses. Not because they have an answer, but because the question
    itself was the trap.
  shift: mixed → negative
  y: -0.2
  order: 2
  is_crisis: true
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '3'
  character: kael
  scene: the-core-day
  label: What the Garden Costs
  action: Kael steps into the garden. The world is real, and it is vast, and nothing
    in it was built for them.
  gap: Kael expected freedom to feel like relief. Instead, it feels like standing
    in a field with no walls and no horizon.
  choice: Kael doesn't look back. Not because the doubt is gone, but because looking
    back would make it real again.
  shift: negative → negative
  y: -0.7
  order: 3
  is_crisis: false
  is_climax: true
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
