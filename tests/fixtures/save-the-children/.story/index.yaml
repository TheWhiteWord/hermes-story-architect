scenes:
- heading: EXT. THE INSTITUTE - DAY
  number: '1'
  characters: []
  location: ''
  one_sentence: A vast decaying building. Nature reclaims the walls.
  content: 'EXT. THE INSTITUTE - DAY

    A vast decaying building. Nature reclaims the walls.'
  content_html: '<h3 data-scenenumber="1">EXT. THE INSTITUTE - DAY</h3>

    <p><span class="haseditorline">A vast decaying building. Nature reclaims the walls.</span>

    </p>

    </p>

    <h3 data-scenenumber="2">INT. CENTRAL ROOM - DAY</h3>

    <p><span class="haseditorline">KAEL (15, intense) stares at a wall of pale light.</span>

    </p>

    </p>

    <div class="dialogue">

    <h4>KAEL</h4>

    <p>Something''s wrong. Everything arrives too perfectly.</p>

    </div>

    <p><span class="haseditorline">MIRA (15, warm) enters behind them.</span>

    </p>

    </p>

    <div class="dialogue">

    <h4>MIRA</h4>

    <p>You''re feeling it too?</p>

    </div>

    <div class="dialogue">

    <h4>KAEL</h4>

    <p class="parenthetical">(chosen)</p>

    <p>I was meant to find this.</p>

    </div>

    <p><span class="haseditorline">*Singing in the darkness~*</span>


    <span class="haseditorline">*A lullaby for the lost~*</span>

    </p>

    </p>

    <h3 data-scenenumber="3">EXT. THE GARDEN - NIGHT</h3>

    <p><span class="haseditorline">Kael walks through simulated moonlight. The grass
    feels real.</span>

    </p>

    </p>

    <h3 data-scenenumber="4">INT. THE CORE - DAY (400 YEARS EARLIER)</h3>

    <p><span class="haseditorline">DR. ELENA VOSS (42, exhausted) works at a terminal.
    MARCUS CHEN (38, empathetic) enters.</span>

    </p>

    </p>

    <div class="dialogue">

    <h4>MARCUS</h4>

    <p>They''re at the gates. They want in.</p>

    </div>

    <div class="dialogue">

    <h4>ELENA</h4>

    <p>The project is too fragile. We can''t compromise.</p>

    </div>

    <div class="dialogue">

    <h4>MARCUS</h4>

    <p>They''re dying, Elena. We all are.</p>

    </div>

    <div class="dialogue">

    <h4>ELENA</h4>

    <p class="parenthetical">(almost to herself)</p>

    <p>The truth would kill them.</p>

    </div>

    <h3 data-scenenumber="5">EXT. THE INSTITUTE - NIGHT (400 YEARS EARLIER)</h3>

    <p><span class="haseditorline">Outsiders gather. Desperate. Hopeful.</span>

    </p>

    </p>

    <h3 data-scenenumber="6">INT. CENTRAL ROOM - NIGHT</h3>

    <p><span class="haseditorline">Kael stands before the door. The Administrator''s
    voice echoes.</span>

    </p>

    </p>

    <div class="dialogue">

    <h4>ADMINISTRATOR (V.O.)</h4>

    <p>You don''t understand what you''d be entering.</p>

    </div>

    <div class="dialogue">

    <h4>KAEL</h4>

    <p>I understand I was chosen.</p>

    </div>

    <p><span class="haseditorline">The door opens.</span>

    </p>

    </p>

    <h2>CUT TO:</h2>

    <h3 data-scenenumber="7">OPENING TITLES</h3>

    <p><span class="haseditorline centered">THE END</span>

    </p>

    </p>

    <hr />

    <p><span class="haseditorline">[[This is a writer''s note about the scene]]</span>

    </p>

    </p>

    <h3 data-scenenumber="8">INT. THE CORE - DAY</h3>

    <p><span class="haseditorline">Kael and Mira stand before the terminal. Elena''s
    ghost flickers.</span>

    </p>

    </p>

    <div class="dialogue">

    <h4>ELENA</h4>

    <p>You were never meant to escape.</p>

    </div>

    <div class="dialogue">

    <h4>MIRA</h4>

    <p>Then why show us the door?</p>

    </div>

    <div class="dialogue">

    <h4>ELENA</h4>

    <p>Because the door was always open.</p>

    </div>

    <h2>SMASH CUT TO:</h2>

    <h3 data-scenenumber="9">EXT. THE INSTITUTE - DAY</h3>

    <p><span class="haseditorline">The building crumbles. The children emerge into
    the real world.</span>

    </p>

    </p>

    <h2>FADE OUT.</h2>'
