arcs:
- id: '1'
  character: dr-elena-voss
  scene: central-room-day
  label: First Doubt
  action: Elena watches the first child mind archive complete
  gap: She expected relief — feels only the weight of the bodies left behind
  choice: She approves the next archive without hesitation
  shift: positive → mixed
  y: 0.5
  order: 1
  is_crisis: false
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '2'
  character: dr-elena-voss
  scene: central-room-night
  label: The Weight of Choice
  action: Elena alone in the control room reviews the archive logs
  gap: She discovers anomalies in the earliest archives — the children's memories
    show signs of corruption
  choice: She decides to hide the anomalies, telling herself it's to avoid panic
  shift: mixed → negative
  y: -0.2
  order: 2
  is_crisis: false
  is_climax: false
  sections:
  - Action
  - Gap
  - Choice
  - Shift
  - Development Log
- id: '3'
  character: dr-elena-voss
  scene: the-core-day
  label: Acceptance
  action: Elena stands before the core system, preparing to reveal everything to Marcus
    and the children
  gap: She expects condemnation — instead sees their complicated gratitude
  choice: She speaks the truth without omission or apology
  shift: negative → ironic
  y: -0.5
  order: 3
  is_crisis: false
  is_climax: true
  sections:
  - Action
  - Gap
  - Choice
  - Shift
