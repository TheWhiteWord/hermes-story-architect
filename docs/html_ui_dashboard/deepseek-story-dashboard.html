<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Dashboard</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
    :root {
        --font-size-sm: 0.85rem;
        --font-size-xs: 0.75rem;
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 0.75rem;
        --spacing-lg: 1rem;
        --spacing-xl: 1.5rem;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: inherit;
        color: var(--foreground);
        background: transparent;
        line-height: 1.4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        overflow: hidden;
    }

    /* Header */
    .header {
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--card);
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        min-width: 0;
    }

    .project-title {
        font-size: 1.1rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .project-subtitle {
        font-size: var(--font-size-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .header-actions {
        display: flex;
        gap: var(--spacing-sm);
        flex-shrink: 0;
    }

    .btn {
        padding: var(--spacing-xs) var(--spacing-md);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--foreground);
        cursor: pointer;
        font-size: var(--font-size-sm);
        transition: all 0.2s;
        white-space: nowrap;
    }

    .btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    .btn-primary:hover {
        opacity: 0.9;
    }

    /* Main content */
    .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
        gap: 0;
    }

    /* Navigation sidebar */
    .sidebar {
        width: 240px;
        min-width: 240px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--card);
        overflow: hidden;
    }

    .nav-tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        flex-shrink: 0;
    }

    .nav-tab {
        flex: 1;
        padding: var(--spacing-sm) var(--spacing-md);
        background: transparent;
        border: none;
        color: var(--muted-foreground);
        cursor: pointer;
        font-size: var(--font-size-xs);
        white-space: nowrap;
        transition: all 0.2s;
        border-bottom: 2px solid transparent;
    }

    .nav-tab.active {
        color: var(--foreground);
        border-bottom-color: var(--accent);
        font-weight: 600;
    }

    .nav-tab:hover {
        color: var(--foreground);
    }

    .entity-list {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-sm);
    }

    .entity-item {
        padding: var(--spacing-sm) var(--spacing-md);
        margin-bottom: var(--spacing-xs);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.2s;
        font-size: var(--font-size-sm);
        border: 1px solid transparent;
    }

    .entity-item:hover {
        background: var(--card);
        border-color: var(--border);
    }

    .entity-item.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }

    .entity-item-subtitle {
        font-size: var(--font-size-xs);
        color: var(--muted-foreground);
        margin-top: 2px;
    }

    .entity-item.active .entity-item-subtitle {
        color: rgba(255, 255, 255, 0.8);
    }

    /* Detail panel */
    .detail-panel {
        flex: 1;
        padding: var(--spacing-lg);
        overflow-y: auto;
        background: transparent;
        min-width: 0;
    }

    .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: var(--spacing-lg);
        gap: var(--spacing-md);
    }

    .detail-title {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: var(--spacing-xs);
    }

    .detail-subtitle {
        color: var(--muted-foreground);
        font-size: var(--font-size-sm);
    }

    .detail-section {
        margin-bottom: var(--spacing-lg);
        padding: var(--spacing-md);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
    }

    .detail-section-title {
        font-weight: 600;
        font-size: var(--font-size-sm);
        margin-bottom: var(--spacing-sm);
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .detail-text {
        font-size: var(--font-size-sm);
        line-height: 1.5;
    }

    .tag-container {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-xs);
        margin-top: var(--spacing-sm);
    }

    .tag {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: var(--font-size-xs);
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s;
    }

    .tag:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }

    .hermes-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-xs) var(--spacing-md);
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        color: var(--accent);
        cursor: pointer;
        font-size: var(--font-size-sm);
        transition: all 0.2s;
        background: transparent;
        white-space: nowrap;
    }

    .hermes-btn:hover {
        background: var(--accent);
        color: white;
    }

    /* Graph view */
    .graph-container {
        position: relative;
        flex: 1;
        min-height: 300px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
    }

    #graph {
        width: 100%;
        height: 100%;
    }

    .graph-legend {
        position: absolute;
        top: var(--spacing-sm);
        right: var(--spacing-sm);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
        padding: var(--spacing-sm);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
    }

    .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .legend-dot.character { background: #4ECDC4; }
    .legend-dot.location { background: #FF6B6B; }
    .legend-dot.scene { background: #95E1D3; }
    .legend-dot.plot { background: #F38181; }

    /* Stats bar */
    .stats-bar {
        display: flex;
        gap: var(--spacing-md);
        padding: var(--spacing-sm) var(--spacing-lg);
        border-top: 1px solid var(--border);
        background: var(--card);
        flex-shrink: 0;
        font-size: var(--font-size-xs);
        color: var(--muted-foreground);
    }

    .stat-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
    }

    .stat-value {
        font-weight: 600;
        color: var(--foreground);
    }

    /* Search */
    .search-bar {
        padding: var(--spacing-sm);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }

    .search-input {
        width: 100%;
        padding: var(--spacing-xs) var(--spacing-sm);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--foreground);
        font-size: var(--font-size-sm);
        outline: none;
    }

    .search-input:focus {
        border-color: var(--accent);
    }

    /* Loading state */
    .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted-foreground);
    }

    .loading-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: var(--spacing-sm);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .main-content {
            flex-direction: column;
        }
        
        .sidebar {
            width: 100%;
            min-width: 100%;
            max-height: 200px;
        }
        
        .detail-panel {
            padding: var(--spacing-md);
        }
        
        .graph-container {
            min-height: 250px;
        }
        
        .header {
            padding: var(--spacing-sm);
        }
        
        .stats-bar {
            flex-wrap: wrap;
            padding: var(--spacing-sm);
        }
    }
</style>
</head>
<body>
<div id="app">
    <!-- Loading state -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <span>Loading story data...</span>
    </div>

    <!-- Main app (hidden until loaded) -->
    <div id="app-content" style="display: none;">
        <header class="header">
            <div class="header-left">
                <div>
                    <div class="project-title" id="project-name">Loading...</div>
                    <div class="project-subtitle" id="project-subtitle"></div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="switchView('graph')" title="Character graph">
                    📊 Graph
                </button>
                <button class="btn" onclick="switchView('list')" title="List view">
                    📝 List
                </button>
                <button class="btn" onclick="refreshData()" title="Refresh data">
                    🔄 Refresh
                </button>
                <button class="hermes-btn" data-hermes-send="" id="project-hermes-btn">
                    💬 Ask Hermes
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="search-bar">
                    <input type="text" class="search-input" id="search-input" placeholder="Search entities..." oninput="filterEntities()">
                </div>
                <nav class="nav-tabs" id="nav-tabs">
                    <button class="nav-tab active" data-type="characters" onclick="switchTab('characters')">Characters</button>
                    <button class="nav-tab" data-type="scenes" onclick="switchTab('scenes')">Scenes</button>
                    <button class="nav-tab" data-type="locations" onclick="switchTab('locations')">Locations</button>
                    <button class="nav-tab" data-type="plots" onclick="switchTab('plots')">Plots</button>
                    <button class="nav-tab" data-type="worlds" onclick="switchTab('worlds')">Worlds</button>
                </nav>
                <div class="entity-list" id="entity-list">
                    <!-- Entity list will be rendered here -->
                </div>
            </aside>

            <!-- Detail panel -->
            <main class="detail-panel" id="detail-panel">
                <!-- Detail content will be rendered here -->
            </main>
        </div>

        <!-- Stats bar -->
        <footer class="stats-bar" id="stats-bar">
            <!-- Stats will be rendered here -->
        </footer>
    </div>
</div>

<script>
// Global state
let storyData = null;
let currentTab = 'characters';
let currentView = 'list';
let currentEntity = null;
let graphNetwork = null;
let filteredEntities = [];

// Initialize the dashboard
async function initDashboard() {
    try {
        // Try to load the index.yaml
        const indexPath = '.story/index.yaml';
        const response = await fetch(indexPath);
        
        if (!response.ok) {
            throw new Error('Failed to load story data');
        }
        
        const yamlText = await response.text();
        storyData = jsyaml.load(yamlText);
        
        // Update UI with loaded data
        updateProjectHeader();
        updateStats();
        switchTab('characters');
        
        // Hide loading, show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        
        // Set up project-level Hermes button
        if (storyData.project && storyData.project.name) {
            document.getElementById('project-hermes-btn').dataset.hermesSend = 
                `Give me an overview of ${storyData.project.name}.`;
        }
    } catch (error) {
        console.error('Error loading story data:', error);
        document.getElementById('loading').innerHTML = 
            `<span>Error: ${error.message}. Make sure the story index exists.</span>`;
    }
}

// Update project header
function updateProjectHeader() {
    if (!storyData.project) return;
    
    const project = storyData.project;
    document.getElementById('project-name').textContent = project.name || 'Untitled Project';
    
    const subtitleParts = [];
    if (project.genre) subtitleParts.push(project.genre);
    if (project.logline) subtitleParts.push(project.logline);
    document.getElementById('project-subtitle').textContent = subtitleParts.join(' • ');
}

// Update stats bar
function updateStats() {
    const statsBar = document.getElementById('stats-bar');
    if (!storyData) return;
    
    const stats = [
        { label: 'Characters', value: storyData.characters?.length || 0 },
        { label: 'Scenes', value: storyData.scenes?.length || 0 },
        { label: 'Locations', value: storyData.locations?.length || 0 },
        { label: 'Plots', value: storyData.plots?.length || 0 },
        { label: 'Worlds', value: storyData.worlds?.length || 0 },
    ];
    
    statsBar.innerHTML = stats.map(stat => `
        <div class="stat-item">
            <span class="stat-value">${stat.value}</span>
            <span>${stat.label}</span>
        </div>
    `).join('');
}

// Switch active tab
function switchTab(type) {
    currentTab = type;
    currentEntity = null;
    
    // Update tab styling
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.type === type);
    });
    
    // Clear search
    document.getElementById('search-input').value = '';
    
    // Render entity list
    renderEntityList();
}

// Switch between graph and list views
function switchView(view) {
    currentView = view;
    
    if (view === 'graph') {
        showGraphView();
    } else {
        showListView();
    }
}

// Show list view
function showListView() {
    renderEntityList();
    if (currentEntity) {
        renderEntityDetail(currentEntity);
    }
}

// Show graph view
function showGraphView() {
    const detailPanel = document.getElementById('detail-panel');
    detailPanel.innerHTML = `
        <div class="graph-container">
            <div id="graph"></div>
            <div class="graph-legend">
                <div class="legend-item"><span class="legend-dot character"></span> Characters</div>
                <div class="legend-item"><span class="legend-dot location"></span> Locations</div>
                <div class="legend-item"><span class="legend-dot scene"></span> Scenes</div>
                <div class="legend-item"><span class="legend-dot plot"></span> Plots</div>
            </div>
        </div>
    `;
    
    renderCharacterGraph();
}

// Render entity list based on current tab
function renderEntityList() {
    const listContainer = document.getElementById('entity-list');
    const searchTerm = document.getElementById('search-input').value.toLowerCase();
    
    if (!storyData || !storyData[currentTab]) {
        listContainer.innerHTML = '<div class="loading">No data available</div>';
        return;
    }
    
    let entities = storyData[currentTab] || [];
    
    // Filter by search term
    if (searchTerm) {
        entities = entities.filter(entity => {
            const searchableFields = [entity.name, entity.id, entity.heading, entity.role];
            return searchableFields.some(field => 
                field && field.toLowerCase().includes(searchTerm)
            );
        });
    }
    
    filteredEntities = entities;
    
    if (entities.length === 0) {
        listContainer.innerHTML = '<div class="loading">No entities found</div>';
        return;
    }
    
    listContainer.innerHTML = entities.map(entity => {
        const isActive = currentEntity && currentEntity.id === entity.id;
        const subtitle = getEntitySubtitle(entity, currentTab);
        
        return `
            <div class="entity-item ${isActive ? 'active' : ''}" 
                 onclick="selectEntity('${entity.id}')"
                 data-entity-id="${entity.id}">
                <div>${entity.name || entity.heading || entity.id}</div>
                ${subtitle ? `<div class="entity-item-subtitle">${subtitle}</div>` : ''}
            </div>
        `;
    }).join('');
}

// Get subtitle for entity based on type
function getEntitySubtitle(entity, type) {
    switch(type) {
        case 'characters':
            return entity.role || '';
        case 'scenes':
            return entity.location || '';
        case 'locations':
            return entity.one_sentence || '';
        case 'plots':
            return entity.status || '';
        case 'worlds':
            return entity.one_sentence || '';
        default:
            return '';
    }
}

// Filter entities based on search
function filterEntities() {
    renderEntityList();
}

// Select an entity
function selectEntity(entityId) {
    const entity = filteredEntities.find(e => e.id === entityId);
    if (entity) {
        currentEntity = entity;
        renderEntityDetail(entity);
        renderEntityList(); // Re-render to update active state
    }
}

// Render entity detail
function renderEntityDetail(entity) {
    const detailPanel = document.getElementById('detail-panel');
    
    switch(currentTab) {
        case 'characters':
            renderCharacterDetail(entity, detailPanel);
            break;
        case 'scenes':
            renderSceneDetail(entity, detailPanel);
            break;
        case 'locations':
            renderLocationDetail(entity, detailPanel);
            break;
        case 'plots':
            renderPlotDetail(entity, detailPanel);
            break;
        case 'worlds':
            renderWorldDetail(entity, detailPanel);
            break;
    }
}

// Render character detail
function renderCharacterDetail(character, container) {
    const relatedScenes = character.scenes || [];
    const relatedPlots = character.plots || [];
    
    container.innerHTML = `
        <div class="detail-header">
            <div>
                <h2 class="detail-title">${character.name || character.id}</h2>
                ${character.role ? `<div class="detail-subtitle">${character.role}</div>` : ''}
            </div>
            <button class="hermes-btn" data-hermes-send="Tell me more about ${character.name}'s character development.">
                💬 Ask Hermes
            </button>
        </div>
        
        ${character.one_sentence ? `
            <div class="detail-section">
                <div class="detail-section-title">One Sentence</div>
                <div class="detail-text">${character.one_sentence}</div>
            </div>
        ` : ''}
        
        ${character.goals_short && character.goals_short.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Short-term Goals</div>
                <div class="tag-container">
                    ${character.goals_short.map(goal => `<span class="tag">${goal}</span>`).join('')}
                </div>
            </div>
        ` : ''}
        
        ${character.goals_long && character.goals_long.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Long-term Goals</div>
                <div class="tag-container">
                    ${character.goals_long.map(goal => `<span class="tag">${goal}</span>`).join('')}
                </div>
            </div>
        ` : ''}
        
        ${character.knowledge && character.knowledge.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Knowledge</div>
                <div class="tag-container">
                    ${character.knowledge.map(item => `<span class="tag">${item}</span>`).join('')}
                </div>
            </div>
        ` : ''}
        
        ${relatedScenes.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Scenes</div>
                <div class="tag-container">
                    ${relatedScenes.map(sceneId => {
                        const scene = storyData.scenes?.find(s => s.id === sceneId);
                        return scene ? `<span class="tag" onclick="selectSceneById('${scene.id}')">${scene.heading || scene.id}</span>` : '';
                    }).filter(Boolean).join('')}
                </div>
            </div>
        ` : ''}
        
        ${relatedPlots.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Plot Involvement</div>
                <div class="tag-container">
                    ${relatedPlots.map(plotId => {
                        const plot = storyData.plots?.find(p => p.id === plotId);
                        return plot ? `<span class="tag" onclick="selectPlotById('${plot.id}')">${plot.name || plot.id}</span>` : '';
                    }).filter(Boolean).join('')}
                </div>
            </div>
        ` : ''}
        
        ${character.sections && character.sections.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Sections</div>
                <div class="tag-container">
                    ${character.sections.map(section => `<span class="tag">${section}</span>`).join('')}
                </div>
            </div>
        ` : ''}
    `;
}

// Render scene detail
function renderSceneDetail(scene, container) {
    container.innerHTML = `
        <div class="detail-header">
            <div>
                <h2 class="detail-title">${scene.heading || scene.id}</h2>
                ${scene.location ? `<div class="detail-subtitle">📍 ${scene.location}</div>` : ''}
            </div>
            <button class="hermes-btn" data-hermes-send="What happens in ${scene.heading || scene.id}?">
                💬 Ask Hermes
            </button>
        </div>
        
        ${scene.characters && scene.characters.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Characters</div>
                <div class="tag-container">
                    ${scene.characters.map(charId => {
                        const character = storyData.characters?.find(c => c.id === charId);
                        return character ? `<span class="tag" onclick="selectCharacterById('${character.id}')">${character.name || character.id}</span>` : '';
                    }).filter(Boolean).join('')}
                </div>
            </div>
        ` : ''}
        
        ${scene.plots && scene.plots.length > 0 ? `
            <div class="detail-section">
                <div class="detail-section-title">Plot Threads</div>
                <div class="tag-container">
                    ${scene.plots.map(plotId => {
                        const plot = storyData.plots?.find(p => p.id === plotId);
                        return plot ? `<span class="tag" onclick="selectPlotById('${plot.id}')">${plot.name || plot.id}</span>` : '';
                    }).filter(Boolean).join('')}
                </div>
            </div>
        ` : ''}
        
        <div class="detail-section">
            <div class="detail-section-title">Scene Content</div>
            <div class="detail-text" id="scene-content">
                <button class="btn" onclick="loadSceneContent('${scene.id}')">Load scene content</button>
            </div>
        </div>
    `;
}

// Load scene content from screenplay.md
async function loadSceneContent(sceneId) {
    try {
        const response = await fetch('screenplay.md');
        if (!response.ok) throw new Error('Failed to load screenplay');
        
        const text = await response.text();
        const scene = storyData.scenes?.find(s => s.id === sceneId);
        
        if (!scene) return;
        
        // Simple extraction - find the scene heading in the screenplay
        const headingPattern = new RegExp(`#+\\s*${scene.heading || scene.id}|${scene.heading || scene.id}`, 'i');
        const lines = text.split('\n');
        let startIndex = lines.findIndex(line => headingPattern.test(line));
        
        if (startIndex === -1) {
            document.getElementById('scene-content').innerHTML = '<em>Scene content not found in screenplay.md</em>';
            return;
        }
        
        // Find the end of the scene (next scene heading)
        let endIndex = lines.length;
        for (let i = startIndex + 1; i < lines.length; i++) {
            if (/^#+\s+/.test(lines[i])) {
                endIndex = i;
                break;
            }
        }
        
        const sceneContent = lines.slice(startIndex, endIndex).join('\n');
        document.getElementById('scene-content').innerHTML = `<pre>${sceneContent}</pre>`;
    } catch (error) {
        document.getElementById('scene-content').innerHTML = `<em>Error loading scene: ${error.message}</em>`;
    }
}

// Render character graph using vis-network
function renderCharacterGraph() {
    const container = document.getElementById('graph');
    if (!container || !storyData) return;
    
    const nodes = [];
    const edges = [];
    
    // Add character nodes
    (storyData.characters || []).forEach(character => {
        nodes.push({
            id: character.id,
            label: character.name || character.id,
            title: character.role || '',
            group: 'character',
            shape: 'dot',
            size: 20,
            font: { size: 12, color: getComputedStyle(document.documentElement).getPropertyValue('--foreground') }
        });
    });
    
    // Add scene nodes
    (storyData.scenes || []).forEach(scene => {
        nodes.push({
            id: scene.id,
            label: scene.heading || scene.id,
            title: 'Scene',
            group: 'scene',
            shape: 'box',
            size: 10,
            font: { size: 10, color: getComputedStyle(document.documentElement).getPropertyValue('--foreground') }
        });
    });
    
    // Add location nodes
    (storyData.locations || []).forEach(location => {
        nodes.push({
            id: location.id,
            label: location.name || location.id,
            title: 'Location',
            group: 'location',
            shape: 'diamond',
            size: 15,
            font: { size: 11, color: getComputedStyle(document.documentElement).getPropertyValue('--foreground') }
        });
    });
    
    // Add plot nodes
    (storyData.plots || []).forEach(plot => {
        nodes.push({
            id: plot.id,
            label: plot.name || plot.id,
            title: 'Plot',
            group: 'plot',
            shape: 'triangle',
            size: 18,
            font: { size: 11, color: getComputedStyle(document.documentElement).getPropertyValue('--foreground') }
        });
    });
    
    // Add edges: Character -> Scene
    (storyData.characters || []).forEach(character => {
        (character.scenes || []).forEach(sceneId => {
            edges.push({ from: character.id, to: sceneId, color: { color: '#4ECDC4' } });
        });
    });
    
    // Add edges: Scene -> Location
    (storyData.scenes || []).forEach(scene => {
        if (scene.location) {
            edges.push({ from: scene.id, to: scene.location, color: { color: '#FF6B6B' } });
        }
    });
    
    // Add edges: Character -> Plot
    (storyData.characters || []).forEach(character => {
        (character.plots || []).forEach(plotId => {
            edges.push({ from: character.id, to: plotId, color: { color: '#F38181' } });
        });
    });
    
    // Add edges: Scene -> Plot
    (storyData.scenes || []).forEach(scene => {
        (scene.plots || []).forEach(plotId => {
            edges.push({ from: scene.id, to: plotId, color: { color: '#F38181' } });
        });
    });
    
    const data = {
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges)
    };
    
    const options = {
        layout: {
            improvedLayout: true,
            randomSeed: 42
        },
        physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            stabilization: { iterations: 200 }
        },
        interaction: {
            hover: true,
            tooltipDelay: 200
        },
        groups: {
            character: { color: { background: '#4ECDC4', border: '#3BA99F' } },
            location: { color: { background: '#FF6B6B', border: '#D94F4F' } },
            scene: { color: { background: '#95E1D3', border: '#78C4B6' } },
            plot: { color: { background: '#F38181', border: '#D66464' } }
        }
    };
    
    graphNetwork = new vis.Network(container, data, options);
    
    // Handle node clicks
    graphNetwork.on('click', function(params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            handleGraphNodeClick(nodeId);
        }
    });
}

// Handle graph node clicks
function handleGraphNodeClick(nodeId) {
    // Determine entity type from node ID
    let entityType = null;
    let entity = null;
    
    for (const type of ['characters', 'scenes', 'locations', 'plots', 'worlds']) {
        const found = (storyData[type] || []).find(e => e.id === nodeId);
        if (found) {
            entityType = type;
            entity = found;
            break;
        }
    }
    
    if (entity && entityType) {
        // Switch to list view and show entity
        currentView = 'list';
        currentTab = entityType;
        currentEntity = entity;
        
        // Update UI
        switchTab(entityType);
        renderEntityDetail(entity);
        renderEntityList();
    }
}

// Helper functions for navigation
function selectCharacterById(id) {
    const character = storyData.characters?.find(c => c.id === id);
    if (character) {
        currentTab = 'characters';
        currentEntity = character;
        switchTab('characters');
        renderEntityDetail(character);
    }
}

function selectSceneById(id) {
    const scene = storyData.scenes?.find(s => s.id === id);
    if (scene) {
        currentTab = 'scenes';
        currentEntity = scene;
        switchTab('scenes');
        renderEntityDetail(scene);
    }
}

function selectPlotById(id) {
    const plot = storyData.plots?.find(p => p.id === id);
    if (plot) {
        currentTab = 'plots';
        currentEntity = plot;
        switchTab('plots');
        renderEntityDetail(plot);
    }
}

// Refresh data
async function refreshData() {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('app-content').style.display = 'none';
    
    // Reset state
    storyData = null;
    currentEntity = null;
    filteredEntities = [];
    
    // Reinitialize
    await initDashboard();
}

document.addEventListener('DOMContentLoaded', initDashboard);
